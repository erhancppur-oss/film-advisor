name: film_advisor
description: "Film Advisor - movie & TV show discovery and recommendations (TMDB powered)."
publish_to: 'none'

# versionName+versionCode. CI overrides the build number with --build-number.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: '>=1.2.0 <3.0.0'
  provider: '>=6.1.0 <8.0.0'
  shared_preferences: '>=2.3.0 <4.0.0'
  cached_network_image: '>=3.4.0 <5.0.0'
  url_launcher: '>=6.3.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <8.0.0'
  flutter_launcher_icons: '>=0.14.0 <1.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E0F1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
