name: Store screenshots (emulator)

on:
  workflow_dispatch:
  push:
    branches: [shots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: python3 tool/prepare_android.py --app-id com.maximasoft.filmadvisor

      - name: Pub get & icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart --dart-define=TMDB_API_KEY=$TMDB_API_KEY --dart-define=SHOT_LANG=en -d emulator-5554
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart --dart-define=TMDB_API_KEY=$TMDB_API_KEY --dart-define=SHOT_LANG=tr -d emulator-5554

      - name: Publish screenshots to branch shots-output
        if: always()
        run: |
          ls -la screenshots || exit 0
          cd screenshots
          git init -q -b shots-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots-output
